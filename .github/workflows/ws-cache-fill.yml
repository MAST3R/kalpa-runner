name: ws-cache-fill

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Ladder Level (L0: 30 concepts [10/canon], L1: 150 concepts [50/canon], L2: Full 6,812 Corpus)"
        type: choice
        options: [L0, L1, L2]
        default: L1
      product:
        description: "Target Product"
        type: choice
        options: [all, atom, scope, tesla]
        default: all

permissions:
  contents: read

jobs:
  prewarm:
    name: prewarm-fleet (${{ inputs.level || 'L1' }} - ${{ inputs.product || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Private Engine
        uses: actions/checkout@v4
        with:
          repository: MAST3R/kalpa
          token: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
          path: pvt

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pvt/pnpm-lock.yaml

      - name: Install Dependencies
        run: cd pvt && pnpm install --frozen-lockfile

      - name: Prewarm WebSocket Fleet (Fresh Run, 135 Sockets, 63k TPM Clamp)
        run: |
          cd pvt && npx tsx src/cli/index.ts prewarm --product ${{ inputs.product }} --level ${{ inputs.level }} --ws-only
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}

      - name: Validate Prewarmed Cache Gates
        run: |
          cd pvt && KALPA_CACHE_DB=state/cache.db npx tsx scripts/validate-cache.ts

      - name: Compress and Sync Cache Asset
        env:
          GH_TOKEN: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p pvt/state
          zstd -19 -f pvt/state/cache.db -o pvt/state/cache_${{ inputs.product }}.db.zst || true
          
          # Upload release asset to MAST3R/kalpa-output
          gh release upload v-cache-latest pvt/state/cache_${{ inputs.product }}.db.zst --repo MAST3R/kalpa-output --clobber || \
          gh release create v-cache-latest pvt/state/cache_${{ inputs.product }}.db.zst --repo MAST3R/kalpa-output --title "Kalpa Pre-Warmed Cache DB" --notes "Latest pre-warmed cache db" || echo "Release created"
