name: ws-cache-fill
on:
  workflow_dispatch:
    inputs:
      product:
        description: product to prewarm
        type: choice
        options: [all, atom, scope, tesla]
        default: all
      limit:
        description: concept limit per product (leave empty for full canon)
        type: string
        default: "10"
jobs:
  prewarm:
    strategy:
      matrix:
        product: ${{ inputs.product == 'all' && fromJSON('["atom", "scope", "tesla"]') || fromJSON(format('["{0}"]', inputs.product)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MAST3R/kalpa
          token: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
          path: pvt
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pvt/pnpm-lock.yaml
      - name: Install dependencies
        run: cd pvt && pnpm install
      - name: prewarm WS fleet (108 sockets)
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ inputs.limit }}"
          fi
          cd pvt && npx tsx src/cli/index.ts prewarm --product ${{ matrix.product }} $LIMIT_FLAG --ws-only
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}
      - run: cd pvt && npx tsx src/cli/index.ts pack --product ${{ matrix.product }} || echo "pack optional"
      - name: push bundles to app repo + cache Release
        env:
          GH_TOKEN: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zstd
          zstd -19 -f pvt/state/cache.db -o pvt/state/cache_${{ matrix.product }}.db.zst || true
          gh release upload v-cache-latest pvt/state/cache_${{ matrix.product }}.db.zst --repo MAST3R/kalpa-output --clobber || echo "no cache artifact yet"
          git clone https://x-access-token:${{ secrets.PVT_CANON_ACCESS_TOKEN }}@github.com/MAST3R/kalpa-${{ matrix.product }}.git out || true
          if [ -d "out" ]; then
            mkdir -p out/assets
            cp pvt/bundles.bin.* pvt/index.db pvt/manifest.json pvt/state/cache.db out/assets/ 2>/dev/null || echo "no bundles yet"
            git -C out config user.name "kalpa-bot"
            git -C out config user.email "bot@kalpa.local"
            git -C out add -A && git -C out diff --cached --quiet || git -C out commit -m "chore(${{ matrix.product }}): cache update $(date -u)"
            git -C out push || echo "nothing to push yet"
          fi
