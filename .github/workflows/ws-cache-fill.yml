name: Kalpa Prewarm Runner

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Target Product Canon (all, atom, scope, tesla)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - atom
          - scope
          - tesla
      level:
        description: "Scale Level (L1, L2, L3, L4)"
        required: true
        default: "L2"
        type: choice
        options:
          - L1
          - L2
          - L3
          - L4

jobs:
  call-prewarm-engine:
    uses: MAST3R/kalpa/.github/workflows/ws-cache-fill-reusable.yml@master
    secrets: inherit
    with:
      product: ${{ inputs.product }}
      level: ${{ inputs.level }}
