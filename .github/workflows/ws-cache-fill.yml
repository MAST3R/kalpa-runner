name: Kalpa Prewarm Runner

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Target Product Canon (all, atom, scope, tesla)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - atom
          - scope
          - tesla
      level:
        description: "Scale Level (L1, L2, L3, L4)"
        required: true
        default: "L2"
        type: choice
        options:
          - L1
          - L2
          - L3
          - L4

jobs:
  prewarm-fleet:
    name: prewarm-fleet (${{ inputs.level }} - ${{ inputs.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout Kalpa Engine Repo
        uses: actions/checkout@v4
        with:
          repository: MAST3R/kalpa
          token: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
          path: pvt

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: cd pvt && pnpm install --frozen-lockfile

      - name: Prewarm WebSocket Fleet (Fresh Run, 108 Sockets, 63k TPM Clamp)
        run: |
          cd pvt && npx tsx src/cli/index.ts prewarm --product ${{ inputs.product }} --level ${{ inputs.level }} --ws-only
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GH_TOKEN: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
          GH_REPO: "MAST3R/kalpa"
          GEMINI_API_KEY_0: ${{ secrets.GEMINI_API_KEY_0 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}

      - name: Validate Prewarmed Cache Gates
        run: |
          cd pvt && KALPA_CACHE_DB=state/cache.db npx tsx scripts/validate-cache.ts --level ${{ inputs.level }}

      - name: Upload Cache DB Artifact (Always Safe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalpa-cache-db-${{ inputs.level }}
          path: pvt/state/cache*.db*
          if-no-files-found: ignore

      - name: Compress and Sync Cache Asset (Always Safe)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p pvt/state
          if [ -f "pvt/state/cache.db" ]; then
            zstd -19 -f pvt/state/cache.db -o pvt/state/cache_${{ inputs.product }}.db.zst || true
            
            # 1. Upload unified release asset to MAST3R/kalpa-output
            gh release upload v-cache-latest pvt/state/cache_${{ inputs.product }}.db.zst --repo MAST3R/kalpa-output --clobber || \
            gh release create v-cache-latest pvt/state/cache_${{ inputs.product }}.db.zst --repo MAST3R/kalpa-output --title "Kalpa Pre-Warmed Cache DB" --notes "Latest pre-warmed cache db" || echo "Release created"
            
            # 2. Split into 30MB chunks and push to MAST3R/kalpa-output git repo
            git clone https://x-access-token:${{ secrets.PVT_CANON_ACCESS_TOKEN }}@github.com/MAST3R/kalpa-output.git out_repo || true
            if [ -d "out_repo" ]; then
              mkdir -p out_repo/chunks
              rm -f out_repo/chunks/cache_${{ inputs.product }}.db.zst.part_*
              split -b 30M pvt/state/cache_${{ inputs.product }}.db.zst out_repo/chunks/cache_${{ inputs.product }}.db.zst.part_
              git -C out_repo config user.name "kalpa-bot"
              git -C out_repo config user.email "bot@kalpa.local"
              git -C out_repo add -A
              git -C out_repo diff --cached --quiet || git -C out_repo commit -m "chore(${{ inputs.product }}): update ${{ inputs.level }} 30MB cache chunks"
              git -C out_repo push origin main || git -C out_repo push origin master || echo "Push completed"
            fi
          fi
