name: ws-cache-fill

on:
  workflow_dispatch:
    inputs:
      product:
        description: product to prewarm
        type: choice
        options: [all, atom, scope, tesla]
        default: all
      limit:
        description: concept limit per product (leave empty for full canon)
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  prewarm:
    name: prewarm-${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ inputs.product == 'all' && fromJSON('["atom", "scope", "tesla"]') || fromJSON(format('["{0}"]', inputs.product)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Private Engine
        uses: actions/checkout@v4
        with:
          repository: MAST3R/kalpa
          token: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
          path: pvt

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pvt/pnpm-lock.yaml

      - name: Install Dependencies
        run: cd pvt && pnpm install --frozen-lockfile

      - name: Prewarm WebSocket Fleet (108 sockets, ∞ RPD)
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ inputs.limit }}"
          fi
          cd pvt && npx tsx src/cli/index.ts prewarm --product ${{ matrix.product }} $LIMIT_FLAG --ws-only
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}

      - name: Compress and Sync Cache Asset
        env:
          GH_TOKEN: ${{ secrets.PVT_CANON_ACCESS_TOKEN }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p pvt/state
          zstd -19 -f pvt/state/cache.db -o pvt/state/cache_${{ matrix.product }}.db.zst || true
          
          # Upload release asset to MAST3R/kalpa-output
          gh release upload v-cache-latest pvt/state/cache_${{ matrix.product }}.db.zst --repo MAST3R/kalpa-output --clobber || \
          gh release create v-cache-latest pvt/state/cache_${{ matrix.product }}.db.zst --repo MAST3R/kalpa-output --title "Kalpa Pre-Warmed Cache DB" --notes "Latest pre-warmed cache db" || echo "Release created"
          
          # Commit chunked cache to output repo
          git clone https://x-access-token:${{ secrets.PVT_CANON_ACCESS_TOKEN }}@github.com/MAST3R/kalpa-output.git out_repo || true
          if [ -d "out_repo" ]; then
            mkdir -p out_repo/chunks
            split -b 30M pvt/state/cache_${{ matrix.product }}.db.zst out_repo/chunks/cache_${{ matrix.product }}.db.zst.part_ || true
            git -C out_repo config user.name "kalpa-bot"
            git -C out_repo config user.email "bot@kalpa.local"
            git -C out_repo add -A && git -C out_repo diff --cached --quiet || git -C out_repo commit -m "chore(${{ matrix.product }}): update cache chunks"
            git -C out_repo push || echo "nothing to push"
          fi
